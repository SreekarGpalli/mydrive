<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shared with you · MyDrive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 25h15a6 6 0 0 0 .8-11.95A8 8 0 0 0 9.3 12.1 6.5 6.5 0 0 0 9 25z' fill='%232563eb'/%3E%3C/svg%3E">
<style>
:root{--bg:#f3f6fb;--surface:#fff;--surface2:#eef2f8;--text:#1b1f27;--muted:#5f6673;--line:#e3e7ee;--accent:#2563eb;--accent-ink:#fff;--hover:#eef1f6;--shadow:0 1px 3px rgba(20,30,50,.12),0 8px 24px rgba(20,30,50,.10);
  --c-folder:#5f7895;--c-image:#e0533d;--c-video:#d93a50;--c-audio:#8b5cf6;--c-pdf:#d93025;--c-document:#2f6fe4;--c-spreadsheet:#1e9455;--c-presentation:#e8890c;--c-archive:#6b7280;--c-code:#374151;--c-file:#7a8494}
@media (prefers-color-scheme:dark){:root{--bg:#13161b;--surface:#1b1f26;--surface2:#232831;--text:#e7eaf0;--muted:#a4abb7;--line:#2c323c;--accent:#6b9cff;--accent-ink:#0d1526;--hover:#252a33;--shadow:0 10px 30px rgba(0,0,0,.45);--c-folder:#9fb3cc;--c-file:#9aa3b2;--c-code:#b8c0cc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;font-size:20px;font-weight:600}
header small{font-size:14px;font-weight:400;color:var(--muted);margin-left:6px}
main{max-width:1000px;margin:0 auto;padding:8px 16px 40px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.bar{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap}
.bar .nm{flex:1;min-width:0}
.bar .nm b{display:block;font-size:18px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .nm span{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none;cursor:pointer;font:inherit;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.text{background:transparent;color:var(--accent);padding:6px 10px}
.btn.text:hover{background:var(--hover)}
.pv{background:var(--surface2);display:flex;align-items:center;justify-content:center;min-height:260px;max-height:72vh}
.pv img,.pv video{max-width:100%;max-height:72vh;display:block}
.pv iframe{width:100%;height:72vh;border:0;background:#fff}
.pv audio{width:min(520px,90%);margin:40px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:0 14px 8px;font-size:15px}
.crumbs button{border:0;background:transparent;color:var(--text);padding:4px 8px;border-radius:999px;cursor:pointer;font:inherit}
.crumbs button:hover{background:var(--hover)}
.crumbs span{color:var(--muted)}
.row{display:flex;align-items:center;gap:14px;padding:8px 14px 8px 20px;border-top:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--hover)}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .s{color:var(--muted);width:90px;text-align:right;flex:none}
.row img.t{width:40px;height:40px;object-fit:cover;border-radius:6px;flex:none}
.msg{padding:60px 20px;text-align:center;color:var(--muted)}
.msg h2{color:var(--text);font-weight:500}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
</style>
</head>
<body>
<header><svg viewBox="0 0 40 40" width="34" height="34"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs><path d="M11 31h18.5a7.5 7.5 0 0 0 1-14.93A10 10 0 0 0 11.4 14.6 8.2 8.2 0 0 0 11 31z" fill="url(#lg)"/><path d="M20 26v-9m-4 4 4-4 4 4" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>MyDrive<small>Shared with you</small></header>
<main id="main"><div class="card"><div class="msg">Loading…</div></div></main>
<footer id="foot"></footer>
<script>
'use strict';
const id = location.pathname.split('/').pop();
const enc = encodeURIComponent;
const NS = 'http://www.w3.org/2000/svg';
function h(tag, attrs = {}, ...kids) { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (v == null || v === false) continue; if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'class') e.className = v; else if (k in e) e[k] = v; else e.setAttribute(k, v); } for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); return e; }
const COLORS = { folder: '--c-folder', image: '--c-image', video: '--c-video', audio: '--c-audio', pdf: '--c-pdf', document: '--c-document', spreadsheet: '--c-spreadsheet', presentation: '--c-presentation', archive: '--c-archive', code: '--c-code', file: '--c-file' };
function typeIcon(kind, size) {
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', size); s.setAttribute('height', size); s.style.flex = 'none'; s.style.color = `var(${COLORS[kind] || '--c-file'})`;
  s.innerHTML = kind === 'folder' ? '<path d="M2.5 6.5a2 2 0 0 1 2-2h4.6l2.1 2.2h8.3a2 2 0 0 1 2 2V17.5a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z" fill="currentColor"/>' : '<rect x="3" y="3" width="18" height="18" rx="4" fill="currentColor"/><path d="M7.5 8.5h9M7.5 12h9M7.5 15.5h6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>';
  return s;
}
const fmtSize = n => { if (n < 1024) return n + ' bytes'; const u = ['KB', 'MB', 'GB', 'TB']; let i = -1; do { n /= 1024; i++; } while (n >= 1024 && i < 3); return (n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i]; };
const api = (sub, path = '') => `/api/public/${id}${sub}?path=${enc(path)}`;
let cur = '';

function preview(kind, name, src) {
  const ext = name.split('.').pop().toLowerCase();
  if (kind === 'image' && !['heic', 'heif', 'tif', 'tiff', 'svg'].includes(ext)) return h('img', { src, alt: name });
  if (kind === 'video') return h('video', { src, controls: true });
  if (kind === 'audio') return h('audio', { src, controls: true });
  if (kind === 'pdf') return h('iframe', { src, title: name });
  return null;
}

async function load() {
  const main = document.getElementById('main');
  let d;
  try { const r = await fetch(api('', cur)); d = await r.json(); if (!r.ok) throw new Error(d.error); }
  catch (e) { main.replaceChildren(h('div', { class: 'card' }, h('div', { class: 'msg' }, h('h2', {}, 'Link not available'), h('div', {}, e.message || 'This link doesn\'t work anymore.')))); return; }
  document.title = `${d.name} · MyDrive`;
  document.getElementById('foot').textContent = d.expires ? `This link expires ${new Date(d.expires * 1000).toLocaleString()}` : '';
  const card = h('div', { class: 'card' });
  if (!d.dir) {
    const pv = preview(d.kind, d.name, api('/file'));
    card.append(h('div', { class: 'bar' }, typeIcon(d.kind, 32), h('div', { class: 'nm' }, h('b', {}, d.name), h('span', {}, fmtSize(d.size))), h('a', { class: 'btn primary', href: api('/file') + '&dl=1' }, '⬇ Download')));
    if (pv) card.append(h('div', { class: 'pv' }, pv));
  } else {
    const parts = cur.split('/').filter(Boolean);
    card.append(h('div', { class: 'bar' }, typeIcon('folder', 32), h('div', { class: 'nm' }, h('b', {}, d.name), h('span', {}, `${d.entries.length} item${d.entries.length === 1 ? '' : 's'}`)), h('a', { class: 'btn primary', href: api('/zip', cur) }, '⬇ Download all')));
    if (parts.length) {
      const c = h('div', { class: 'crumbs' }, h('button', { onclick: () => { cur = ''; load(); } }, d.name));
      let acc = '';
      parts.forEach(p => { acc += '/' + p; const to = acc; c.append(h('span', {}, '›'), h('button', { onclick: () => { cur = to; load(); } }, p)); });
      card.append(c);
    }
    if (!d.entries.length) card.append(h('div', { class: 'msg' }, 'This folder is empty.'));
    for (const e of d.entries) {
      const vis = e.thumb ? h('img', { class: 't', src: api('/thumb', e.path), loading: 'lazy', alt: '', onerror: ev => ev.target.replaceWith(typeIcon(e.kind, 28)) }) : typeIcon(e.kind, 28);
      card.append(h('div', { class: 'row', onclick: () => { if (e.dir) { cur = e.path; load(); } else window.open(api('/file', e.path), '_blank', 'noopener'); } },
        vis, h('div', { class: 'n', title: e.name }, e.name), h('div', { class: 's' }, e.dir ? '' : fmtSize(e.size)),
        h('a', { class: 'btn text', href: e.dir ? api('/zip', e.path) : api('/file', e.path) + '&dl=1', title: 'Download', onclick: ev => ev.stopPropagation() }, '⬇')));
    }
  }
  main.replaceChildren(card);
}
load();
</script>
</body>
</html>
