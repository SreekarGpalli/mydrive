[package]
name = "mydrive"
version = "2.0.0"
edition = "2021"
description = "Tiny self-hosted personal drive"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
percent-encoding = "2"
zip = { version = "9", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
dav-server = { version = "0.11", default-features = false, features = ["localfs"] }
bytes = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
